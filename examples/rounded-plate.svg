<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
  <!-- Vector Studio LLM example · 2 px = 1 mm · 120 x 80 mm plate with parametric
       corner radii: the model is data-vs-pts + data-vs-fillets (index:radius in
       user units); d is DERIVED by the viewer, so every corner stays draggable -->
  <rect data-vs-bg="1" width="320" height="240" fill="#1A1916"/>
  <path data-vs="1" data-vs-pts="40,40 280,40 280,200 40,200" data-vs-closed="1" data-vs-fillets="0:20,1:20,2:40,3:40" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" d="M 60,40 L 260,40 A 20 20 0 0 1 280,60 L 280,160 A 40 40 0 0 1 240,200 L 80,200 A 40 40 0 0 1 40,160 L 40,60 A 20 20 0 0 1 60,40 Z"/>
</svg>
